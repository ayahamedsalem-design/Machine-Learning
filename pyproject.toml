[project]
name = "machine-learning"
version = "0.1.0"
description = "Machine Learning Project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.31.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
machine-learning = "machine_learning:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

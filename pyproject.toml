[project]
name = "machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aya Hamed", email = "aya.hamed.salem@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "openai>=3.49.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
machine-learning = "machine_learning:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

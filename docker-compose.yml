version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use service names (db and redis) for internal Docker network communication
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/qadb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qadb
    volumes:
      # Use named volume for database persistence across container restarts
      - pgdata:/var/lib/postgresql/data
    # Ports are not exposed to the host to keep the database strictly internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Ports are not exposed to the host to keep the cache strictly internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Adminer is optional but kept for your convenience to view the database
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:


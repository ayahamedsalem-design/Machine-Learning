version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always

  # 2. Redis Service
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  # 3. FastAPI Application Service
  web:
    build: .
    container_name: running-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    restart: always

# Define persistent volumes for database storage
volumes:
  pgdata:
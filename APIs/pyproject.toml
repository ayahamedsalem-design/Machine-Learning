[project]
name = "apis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aya Hamed", email = "aya.hamed.salem@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
apis = "apis:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "APIs",
]
